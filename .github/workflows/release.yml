name: Release Windows installer
# Push a tag like v0.2.0 (matching package.json "version") to publish the installer on the Releases page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "既存のタグ（例: v0.2.0）"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check tag matches package.json version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then echo "::error::tag $TAG does not match package.json $version"; exit 1; fi
      - run: npm install
      - run: npm test
      - name: Build installer
        shell: bash
        run: npm run build && npx electron-builder --win nsis --publish never
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.exe --clobber
          else
            gh release create "$TAG" release/*.exe --title "Claude Continuity $TAG" --generate-notes
          fi
