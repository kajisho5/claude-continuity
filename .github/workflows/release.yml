name: Release
# Push a tag like v0.2.0 (matching package.json "version") to publish the installers,
# or run "Package installers" with a release tag: it creates the tag and calls this workflow.
# The release is created as a draft, the Windows, macOS and Linux builds upload to it, and it is published once
# the Windows build has succeeded (a failed macOS or Linux build does not hold back Windows users).
# latest.yml / latest-mac.yml and the blockmaps let installed copies find and download updates (electron-updater).
#
# macOS signing (optional; without it the app is signed ad hoc, opens after the user allows it in
# System Settings > Privacy & Security, and updates by opening the download page). Either:
# - kajisho5/runway's shared Developer ID (used when its secrets are present): this repository is listed in
#   runway's repos.txt, so runway's sync-secrets copies ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64,
#   APPLE_TEAM_ID and MATCH_GIT_TOKEN here. The certificate comes from hanger (signing/developer_id_application.cer
#   + devid.key.enc, decrypted with runway's scripts/asc.py) and notarization uses the same App Store Connect API key.
# - or your own: CSC_LINK (base64 of a "Developer ID Application" .p12) + CSC_KEY_PASSWORD, and for notarization
#   APPLE_API_KEY (base64 of the .p8) + APPLE_API_KEY_ID + APPLE_API_ISSUER, or APPLE_ID +
#   APPLE_APP_SPECIFIC_PASSWORD, plus APPLE_TEAM_ID (https://www.electron.build/docs/notarization)
#
# Where updates are published:
# - Repository variable RELEASES_REPO (e.g. kajisho5/claude-continuity-releases) set: the installers go to that
#   public repository, so the app can check for updates while this source repository stays private.
#   Requires secret RELEASES_TOKEN: a fine-grained token with "Contents: Read and write" on that repository only.
# - Not set: the installers go to this repository's Releases (updates then work only if this repository is public).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "既存のタグ（例: v0.2.0）"
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  TARGET_REPO: ${{ vars.RELEASES_REPO || github.repository }}
  GH_TOKEN: ${{ vars.RELEASES_REPO != '' && secrets.RELEASES_TOKEN || github.token }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then echo "::error::tag $TAG does not match package.json $version"; exit 1; fi
      - name: Check token for an external releases repository
        if: ${{ vars.RELEASES_REPO != '' }}
        env:
          HAS_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then echo "::error::RELEASES_REPO is set but secret RELEASES_TOKEN is missing"; exit 1; fi
      - name: Create the draft release
        run: |
          previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            echo "## 変更内容"
            if [ -n "$previous" ]; then git log --no-merges --pretty='- %s' "$previous..$TAG"; else git log --no-merges --pretty='- %s' -n 30 "$TAG"; fi
          } > release-notes.md
          if ! gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$TARGET_REPO" --draft --title "Claude Continuity $TAG" --notes-file release-notes.md
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      # Windows signing is optional. Either Azure Artifact Signing (formerly Trusted Signing): secrets AZURE_TENANT_ID,
      # AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
      # AZURE_CERT_PROFILE; or a code signing certificate: secrets WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD.
      - name: Build installer (update feed points at the target repository)
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          owner="${TARGET_REPO%%/*}"; repo="${TARGET_REPO#*/}"
          sign=()
          if [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_SIGNING_ENDPOINT" ] && [ -n "$AZURE_SIGNING_ACCOUNT" ] && [ -n "$AZURE_CERT_PROFILE" ]; then
            sign=("-c.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT" "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT" "-c.win.azureSignOptions.certificateProfileName=$AZURE_CERT_PROFILE")
            echo "Signing with Azure Artifact Signing"
          elif [ -n "$WIN_CSC_LINK" ]; then
            echo "Signing with the code signing certificate"
          else
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            echo "::notice::No Windows signing configured; the installer is unsigned"
          fi
          npm run build
          npx electron-builder --win nsis --publish never -c.publish.provider=github "-c.publish.owner=$owner" "-c.publish.repo=$repo" "${sign[@]}"
      - name: Upload to the release
        shell: bash
        run: gh release upload "$TAG" release/*.exe release/*.exe.blockmap release/latest.yml --repo "$TARGET_REPO" --clobber

  mac:
    needs: prepare
    runs-on: macos-latest
    env:
      # HAS_CERT / HAS_NOTARY are only written by the signing steps: a job-level value would shadow GITHUB_ENV.
      HAS_RUNWAY: ${{ secrets.MATCH_GIT_TOKEN != '' && secrets.ASC_KEY_P8_BASE64 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      # Build before any signing material is loaded, so only electron-builder runs with it.
      - run: npm run build
      # Both signing steps hand electron-builder its usual variables through GITHUB_ENV (masked in the log).
      - name: Developer ID from runway (hanger)
        if: ${{ env.HAS_RUNWAY == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          HANGER_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          HANGER_REPO: ${{ vars.HANGER_REPO || format('{0}/hanger', github.repository_owner) }}
          RUNWAY_REPO: ${{ vars.RUNWAY_REPO || format('{0}/runway', github.repository_owner) }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sign"; mkdir -p "$dir"
          python3 -m venv "$dir/venv"; "$dir/venv/bin/pip" install --quiet pyjwt cryptography
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HANGER_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          # runway's asc.py decrypts the shared signing key with the same passphrase rules as runway's own workflows.
          git clone --quiet --depth 1 "https://github.com/$RUNWAY_REPO.git" "$dir/runway" \
            || git -c http.extraheader="$auth" clone --quiet --depth 1 "https://github.com/$RUNWAY_REPO.git" "$dir/runway"
          git -c http.extraheader="$auth" clone --quiet --depth 1 "https://github.com/$HANGER_REPO.git" "$dir/hanger" \
            || { echo "::error::$HANGER_REPO を読めない（MATCH_GIT_TOKEN を確認）"; exit 1; }
          src="$dir/hanger/signing"
          if [ ! -f "$src/developer_id_application.cer" ] || [ ! -f "$src/devid.key.enc" ]; then
            echo "::error::Developer ID 証明書が hanger に無い。runway の Actions → apple-signing を create-developer-id で実行する"; exit 1
          fi
          asc() { "$dir/venv/bin/python" "$dir/runway/scripts/asc.py" "$@"; }
          asc decrypt-key "$src/devid.key.enc" "$dir/devid.key"
          kcpass="$(uuidgen)"
          echo "::add-mask::$kcpass"
          # macOS's `security import` rejects PKCS#12 files using OpenSSL 3's default AES/SHA-256 MAC
          # ("MAC verification failed ... wrong password?"), so write it with the SHA-1/3DES algorithms it accepts.
          /usr/bin/openssl x509 -inform DER -in "$src/developer_id_application.cer" -out "$dir/devid.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$dir/devid.key" -in "$dir/devid.pem" -name devid -out "$dir/devid.p12" -passout "pass:$kcpass" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          # Our own keychain, set up the way runway's mac-notarize does: electron-builder's temporary keychain failed
          # at set-key-partition-list ("SecKeychainUnlock: ... passphrase ... not correct") on these runners.
          kc="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$dir/devid.p12" -k "$kc" -P "$kcpass" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          for ca in DeveloperIDG2CA.cer AppleWWDRCAG3.cer; do
            curl -fsSL -o "$dir/$ca" "https://www.apple.com/certificateauthority/$ca" && security import "$dir/$ca" -k "$kc" -T /usr/bin/codesign || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
          # shellcheck disable=SC2046  # the existing keychain list is split into separate arguments on purpose
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)".*/\1/p' | head -n 1)
          [ -n "$identity" ] || { echo "::error::Developer ID Application の署名 ID がキーチェーンに無い"; security find-identity -v -p codesigning "$kc"; exit 1; }
          key="$(asc write-key)"
          {
            # electron-builder signs with this identity from the keychain above instead of importing a .p12 itself.
            echo "CSC_NAME=${identity#Developer ID Application: }"
            echo "CSC_KEYCHAIN=$kc"
            echo "APPLE_API_KEY=$key"
            echo "APPLE_API_KEY_ID=$ASC_KEY_ID"
            echo "APPLE_API_ISSUER=$ASC_ISSUER_ID"
            echo "HAS_CERT=true"
            echo "HAS_NOTARY=true"
          } >> "$GITHUB_ENV"
          rm -rf "$dir/devid.key" "$dir/devid.p12" "$dir/hanger"
      - name: Own signing secrets
        if: ${{ env.HAS_RUNWAY != 'true' }}
        env:
          OWN_CSC_LINK: ${{ secrets.CSC_LINK }}
          OWN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          OWN_API_KEY: ${{ secrets.APPLE_API_KEY }}
          OWN_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          OWN_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          OWN_APPLE_ID: ${{ secrets.APPLE_ID }}
          OWN_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          OWN_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [ -n "$OWN_CSC_LINK" ] || exit 0
          { echo "CSC_LINK=$OWN_CSC_LINK"; echo "CSC_KEY_PASSWORD=$OWN_CSC_KEY_PASSWORD"; echo "HAS_CERT=true"; } >> "$GITHUB_ENV"
          [ -n "$OWN_TEAM_ID" ] || exit 0
          if [ -n "$OWN_API_KEY" ]; then
            echo "$OWN_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            { echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8"; echo "APPLE_API_KEY_ID=$OWN_API_KEY_ID"; echo "APPLE_API_ISSUER=$OWN_API_ISSUER"; echo "HAS_NOTARY=true"; } >> "$GITHUB_ENV"
          elif [ -n "$OWN_APPLE_ID" ]; then
            { echo "APPLE_ID=$OWN_APPLE_ID"; echo "APPLE_APP_SPECIFIC_PASSWORD=$OWN_APP_PASSWORD"; echo "HAS_NOTARY=true"; } >> "$GITHUB_ENV"
          fi
      - name: Build dmg and zip (arm64 and x64)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          owner="${TARGET_REPO%%/*}"; repo="${TARGET_REPO#*/}"
          extra=()
          if [ "${HAS_CERT:-}" = "true" ]; then
            extra+=("-c.extraMetadata.macSigned=true")
            if [ "${HAS_NOTARY:-}" = "true" ]; then extra+=("-c.mac.notarize=true"); fi
          else
            # No certificate: skip electron-builder's identity lookup; build/adhoc-sign.cjs signs ad hoc.
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac --publish never -c.publish.provider=github "-c.publish.owner=$owner" "-c.publish.repo=$repo" "${extra[@]}"
      # electron-builder notarizes the app inside; the dmg itself is signed, notarized and stapled here so it opens
      # without a Gatekeeper lookup too. Needs the keychain identity from the runway step.
      - name: Notarize the dmg files
        if: ${{ env.CSC_NAME != '' && env.CSC_KEYCHAIN != '' && env.APPLE_API_KEY != '' }}
        run: |
          set -euo pipefail
          for f in release/*.dmg; do
            codesign --force --timestamp --keychain "$CSC_KEYCHAIN" --sign "Developer ID Application: $CSC_NAME" "$f"
            xcrun notarytool submit "$f" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
            for n in 1 2 3 4 5; do xcrun stapler staple "$f" && break; echo "staple retry $n"; sleep $((n * 10)); done
            xcrun stapler validate "$f"
          done
          # The dmg bytes changed: refresh their sha512/size in latest-mac.yml; their blockmaps no longer apply.
          node build/refresh-dmg-hashes.cjs release
          rm -f release/*.dmg.blockmap
      - name: Upload to the release
        run: gh release upload "$TAG" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml --repo "$TARGET_REPO" --clobber
      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/sign" "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Build AppImage
        run: |
          owner="${TARGET_REPO%%/*}"; repo="${TARGET_REPO#*/}"
          npm run build
          npx electron-builder --linux AppImage --publish never -c.publish.provider=github "-c.publish.owner=$owner" "-c.publish.repo=$repo"
      - name: Upload to the release
        run: gh release upload "$TAG" release/*.AppImage release/latest-linux.yml --repo "$TARGET_REPO" --clobber

  publish:
    needs: [windows, mac, linux]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$TARGET_REPO" --draft=false --latest
