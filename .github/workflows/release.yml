name: Release
# Push a tag like v0.2.0 (matching package.json "version") to publish the installers,
# or run "Package installers" with a release tag: it creates the tag and calls this workflow.
# The release is created as a draft, the Windows and macOS builds upload to it, and it is published once
# the Windows build has succeeded (a failed macOS build does not hold back Windows users).
# latest.yml / latest-mac.yml and the blockmaps let installed copies find and download updates (electron-updater).
#
# macOS signing (optional; without it the app is signed ad hoc, opens after the user allows it in
# System Settings > Privacy & Security, and updates by opening the download page):
# - CSC_LINK: base64 of a "Developer ID Application" certificate (.p12), CSC_KEY_PASSWORD: its password
# - Notarization, either APPLE_API_KEY (base64 of the .p8) + APPLE_API_KEY_ID + APPLE_API_ISSUER,
#   or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD, plus APPLE_TEAM_ID
#   (https://www.electron.build/docs/notarization)
#
# Where updates are published:
# - Repository variable RELEASES_REPO (e.g. kajisho5/claude-continuity-releases) set: the installers go to that
#   public repository, so the app can check for updates while this source repository stays private.
#   Requires secret RELEASES_TOKEN: a fine-grained token with "Contents: Read and write" on that repository only.
# - Not set: the installers go to this repository's Releases (updates then work only if this repository is public).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "既存のタグ（例: v0.2.0）"
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  TARGET_REPO: ${{ vars.RELEASES_REPO || github.repository }}
  GH_TOKEN: ${{ vars.RELEASES_REPO != '' && secrets.RELEASES_TOKEN || github.token }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then echo "::error::tag $TAG does not match package.json $version"; exit 1; fi
      - name: Check token for an external releases repository
        if: ${{ vars.RELEASES_REPO != '' }}
        env:
          HAS_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then echo "::error::RELEASES_REPO is set but secret RELEASES_TOKEN is missing"; exit 1; fi
      - name: Create the draft release
        run: |
          previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          {
            echo "## 変更内容"
            if [ -n "$previous" ]; then git log --no-merges --pretty='- %s' "$previous..$TAG"; else git log --no-merges --pretty='- %s' -n 30 "$TAG"; fi
          } > release-notes.md
          if ! gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$TARGET_REPO" --draft --title "Claude Continuity $TAG" --notes-file release-notes.md
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Build installer (update feed points at the target repository)
        shell: bash
        run: |
          owner="${TARGET_REPO%%/*}"; repo="${TARGET_REPO#*/}"
          npm run build
          npx electron-builder --win nsis --publish never -c.publish.provider=github "-c.publish.owner=$owner" "-c.publish.repo=$repo"
      - name: Upload to the release
        shell: bash
        run: gh release upload "$TAG" release/*.exe release/*.exe.blockmap release/latest.yml --repo "$TARGET_REPO" --clobber

  mac:
    needs: prepare
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.CSC_LINK != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_TEAM_ID != '' && (secrets.APPLE_API_KEY != '' || secrets.APPLE_ID != '') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Write the notarization API key
        if: ${{ env.HAS_NOTARY == 'true' }}
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi
      - name: Build dmg and zip (arm64 and x64)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          owner="${TARGET_REPO%%/*}"; repo="${TARGET_REPO#*/}"
          extra=()
          if [ "$HAS_CERT" = "true" ]; then
            extra+=("-c.extraMetadata.macSigned=true")
            if [ "$HAS_NOTARY" = "true" ]; then extra+=("-c.mac.notarize=true"); fi
          else
            # No certificate: skip electron-builder's identity lookup; build/adhoc-sign.cjs signs ad hoc.
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run build
          npx electron-builder --mac --publish never -c.publish.provider=github "-c.publish.owner=$owner" "-c.publish.repo=$repo" "${extra[@]}"
      - name: Upload to the release
        run: gh release upload "$TAG" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml --repo "$TARGET_REPO" --clobber

  publish:
    needs: [windows, mac]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$TARGET_REPO" --draft=false --latest
