name: Build and test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install xvfb if missing
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: E2E tests (Electron + Playwright)
        run: xvfb-run -a npm run test:e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
